name: CI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  desktop:
    name: Desktop - ${{ matrix.name }}

    strategy:
      fail-fast: true
      matrix:
        include:
          - name: windows-x64
            os: windows-latest

          - name: linux-x64
            os: ubuntu-latest

          - name: macos-arm64
            os: macos-latest

          - name: macos-x64
            os: macos-15-intel

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build desktop artifact
        shell: bash
        run: ./gradlew :frontend:zipDesktopDistribution -PappVersion="${{ github.ref_name }}" -Pbuildkonfig.flavor=release

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v7
        with:
          name: kassette-${{ matrix.name }}
          path: frontend/build/distributions/*.zip
          if-no-files-found: error
          retention-days: 14

  wasm:
    name: WebAssembly

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build WebAssembly distribution
        run: ./gradlew :frontend:wasmJsBrowserDistribution -PappVersion="${{ github.ref_name }}" -Pbuildkonfig.flavor=release

      - name: Zip WebAssembly artifact
        working-directory: frontend/build/dist/wasmJs/productionExecutable
        run: zip -r "${{ github.workspace }}/kassette-${{ github.ref_name }}-wasm.zip" .

      - name: Upload WebAssembly artifact
        uses: actions/upload-artifact@v7
        with:
          name: kassette-wasm
          path: kassette-${{ github.ref_name }}-wasm.zip
          if-no-files-found: error
          retention-days: 14

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/build/dist/wasmJs/productionExecutable/

  deploy-pages:
    name: Deploy GitHub Pages

    needs:
      - desktop
      - wasm

    concurrency:
      group: pages
      cancel-in-progress: true

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  release:
    name: Create GitHub Release

    needs:
      - desktop
      - deploy-pages
      - wasm

    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            artifacts/**/*.zip \
            --repo "${{ github.repository }}" \
            --title "Kassette ${{ github.ref_name }}" \
            --generate-notes
