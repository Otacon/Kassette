name: Create release

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  desktop:
    name: Desktop - Conveyor
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build desktop application
        run: ./gradlew :frontend:jvmJar -PappVersion="${{ github.ref_name }}" -Pbuildkonfig.flavor=release

      - name: Package and publish desktop applications
        uses: hydraulic-software/conveyor/actions/build@v22.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ORG_GRADLE_PROJECT_appVersion: ${{ github.ref_name }}
        with:
          command: make copied-site
          conveyor_version: 22.1
          extra_flags: -f ci.conveyor.conf
          signing_key: ${{ secrets.SIGNING_KEY }}
          agree_to_license: 1

      - name: Prepare Conveyor Pages files
        uses: hydraulic-software/conveyor/actions/build@v22.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ORG_GRADLE_PROJECT_appVersion: ${{ github.ref_name }}
        with:
          command: make site
          conveyor_version: 22.1
          extra_flags: -f ci.conveyor.conf
          signing_key: ${{ secrets.SIGNING_KEY }}
          agree_to_license: 1

      - name: Upload Conveyor Pages files
        uses: actions/upload-artifact@v7
        with:
          name: conveyor-pages
          path: |
            output/download.html
            output/icon.png
          if-no-files-found: error
          retention-days: 1

  wasm:
    name: Web - WebAssembly

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build WebAssembly distribution
        run: ./gradlew :frontend:wasmJsBrowserDistribution -PappVersion="${{ github.ref_name }}" -Pbuildkonfig.flavor=release

      - name: Zip WebAssembly artifact
        working-directory: frontend/build/dist/wasmJs/productionExecutable
        run: zip -r "${{ github.workspace }}/kassette-${{ github.ref_name }}-wasm.zip" .

      - name: Upload WebAssembly artifact
        uses: actions/upload-artifact@v7
        with:
          name: kassette-wasm
          path: kassette-${{ github.ref_name }}-wasm.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload WebAssembly Pages files
        uses: actions/upload-artifact@v7
        with:
          name: wasm-pages
          path: frontend/build/dist/wasmJs/productionExecutable/
          if-no-files-found: error
          retention-days: 1

  deploy-pages:
    name: Deploy GitHub Pages

    needs:
      - desktop
      - wasm

    concurrency:
      group: pages
      cancel-in-progress: true

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Download WebAssembly Pages files
        uses: actions/download-artifact@v7
        with:
          name: wasm-pages
          path: pages

      - name: Download Conveyor Pages files
        uses: actions/download-artifact@v7
        with:
          name: conveyor-pages
          path: pages

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload combined Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  release:
    name: Create GitHub Release

    needs:
      - desktop
      - deploy-pages
      - wasm

    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          name: kassette-wasm
          path: artifacts

      - name: Upload WebAssembly release artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          repo="${{ github.repository }}"

          gh release upload "$tag" \
            artifacts/*.zip \
            --repo "$repo" \
            --clobber
